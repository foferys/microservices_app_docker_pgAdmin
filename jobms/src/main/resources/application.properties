# postgreSql ----
spring.datasource.url=jdbc:postgresql://localhost:5433/job
spring.datasource.username=foferys
spring.datasource.password=foferys
spring.jpa.database=POSTGRESQL
spring.servlet.multipart.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
#  imposta il dialetto che deve usare
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# EUREKA -----
# --il servizio risulta disponibile su eureka anche se non mettaimo i dati nel file perch� usa
# ---quelli di default, altrimenti qui indichiamo l'url che il servizio usa per registrarsi a eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
#- mettiamo true perch�  deve poter registrare se stesso nel discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ZIPKIN - qui diciamo di tracciare ogni richiesta fatta (anche se in production non si tracciano tutte, solo 6 o meno)
management.tracing.sampling.probability=1.0

# CONFIG SERVER - stiamo dicendo di importare le configurazioni dal server a quell'URL (possiamo commentare la riga sopra riguardo al nome dell'applicazione)
#Questa riga dice: ?Prima di caricare le configurazioni locali, vai a chiedere al Config Server le mie configurazioni?
#- Job fa una chiamata HTTP a http://localhost:8080
#- specifica nome applicazione + profilo attivo
#- riceve le configurazioni dal repo Git
#? optional: significa:
#- se il Config Server � gi� ? l?app parte lo stesso
#- senza optional ? l?app non parte
spring.config.import=optional:configserver:http://localhost:8080
# - ?Dammi le configurazioni per l?ambiente dev?
spring.profiles.active=dev


# Resilience4]
resilience4j.circuitbreaker.instances.companyBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.companyBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.companyBreaker.minimumNumber0fCalls=5
resilience4j.circuitbreaker.instances.companyBreaker.permittedNumber0fCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.companyBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.companyBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.companyBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.companyBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.companyBreaker.sliding-window-type=count_based


# ACTUATOR - per mostare piu informazini sulla salute dell'applicazione job, tipo quante richiesta stanno avvenendo ecc
# per monitorare i ms
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always