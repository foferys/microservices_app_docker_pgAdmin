spring.application.name=gateway
server.port=8084

# EUREKA -----
# --il servizio risulta disponibile su eureka anche se non mettaimo i dati nel file perché usa
# ---quelli di default, altrimenti qui indichiamo l'url che il servizio usa per registrarsi a eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
#- mettiamo true perché  deve poter registrare se stesso nel discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ZIPKIN - qui diciamo di tracciare ogni richiesta fatta (anche se in production non si tracciano tutte, solo 6 o meno)
management.tracing.sampling.probability=1.0

# GATEWAY
spring.cloud.gateway.server.webmvc.routes[0].id=company-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://COMPANY-SERVICE
# -- /companies/** -- i due * indicano che è valida qualsiasi richiesta che ha il mapping (nel controller)/companies/
# seguito da qualcos'altro
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/companies,/companies/**

spring.cloud.gateway.server.webmvc.routes[1].id=job-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://JOB-SERVICE-DEV
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/jobs,/jobs/**

spring.cloud.gateway.server.webmvc.routes[2].id=review-service 
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/reviews,/reviews/**

spring.cloud.gateway.server.webmvc.routes[3].id=eureka-server
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8761
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/eureka/main
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/
# -- nel caso non si veda vanno aggiunte queste altre tre righe
spring.cloud.gateway.server.webmvc.routes[4].id=eureka-server-static
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8761
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/eureka/**

# IL LIVELLO DI LOGGING delle componenti delle nostre applicazioni
logging.level.root=info
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE
